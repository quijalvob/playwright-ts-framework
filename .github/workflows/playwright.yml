name: Playwright TypeScript Framework
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which test suite to run'
        required: true
        default: 'login'
        type: choice
        options:
          - login
          - inventory
          - cart
          - checkout
          - api
          - all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  login-tests:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'login' || inputs.suite == 'all')) }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      test-path: tests/web/1.login.spec.ts
      report-dir: login
      install-browsers: true

  inventory-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'inventory' || inputs.suite == 'all') }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      test-path: tests/web/2.inventory.spec.ts
      report-dir: inventory
      install-browsers: true

  cart-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'cart' || inputs.suite == 'all') }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      test-path: tests/web/3.cart.spec.ts
      report-dir: cart
      install-browsers: true

  checkout-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'checkout' || inputs.suite == 'all') }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      test-path: tests/web/4.checkout.spec.ts
      report-dir: checkout
      install-browsers: true

  api-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'api' || inputs.suite == 'all') }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      test-path: tests/api/booking.spec.ts
      report-dir: api
      install-browsers: false